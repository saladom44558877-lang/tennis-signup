<!DOCTYPE html>
<html lang="zh-TW">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎾 教練後台</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, sans-serif; color: #1a1a1a; padding: 1rem; }
    .container { max-width: 720px; margin: 0 auto; }

    /* 登入 */
    .login-box { background: #fff; border-radius: 16px; padding: 2rem; max-width: 360px; margin: 4rem auto; box-shadow: 0 4px 16px rgba(0,0,0,.08); text-align: center; }
    .login-title { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
    .login-sub { font-size: 13px; color: #888; margin-bottom: 20px; }
    .login-input { width: 100%; padding: 10px 14px; border: 1.5px solid #e2e8f0; border-radius: 9px; font-size: 14px; outline: none; margin-bottom: 12px; }
    .login-input:focus { border-color: #1d4ed8; }
    .login-btn { width: 100%; padding: 11px; background: #1d4ed8; color: #fff; border: none; border-radius: 9px; font-size: 15px; font-weight: 700; cursor: pointer; }
    .login-btn:hover { background: #1e40af; }
    .login-err { color: #dc2626; font-size: 12px; margin-top: 8px; }

    /* 後台主體 */
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
    .header-title { font-size: 20px; font-weight: 700; }
    .logout-btn { font-size: 12px; color: #888; background: none; border: 1px solid #ddd; padding: 5px 12px; border-radius: 20px; cursor: pointer; }

    /* 統計卡片 */
    .stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 1.5rem; }
    .stat { background: #fff; border-radius: 12px; padding: 14px; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,.05); }
    .stat-n { font-size: 26px; font-weight: 700; }
    .stat-n.pending { color: #d97706; }
    .stat-n.paid { color: #16a34a; }
    .stat-n.cancel { color: #dc2626; }
    .stat-l { font-size: 12px; color: #888; margin-top: 2px; }

    /* 篩選 */
    .filter-bar { display: flex; gap: 8px; margin-bottom: 1rem; flex-wrap: wrap; }
    .filter-btn { padding: 5px 14px; border-radius: 20px; border: 1.5px solid #e2e8f0; font-size: 12px; cursor: pointer; background: #fff; color: #666; font-weight: 500; }
    .filter-btn.active { background: #1d4ed8; color: #fff; border-color: #1d4ed8; }

    /* 報名卡片 */
    .reg-card { background: #fff; border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.05); border-left: 4px solid #e2e8f0; }
    .reg-card.pending { border-left-color: #f59e0b; }
    .reg-card.paid { border-left-color: #22c55e; }
    .reg-card.cancel { border-left-color: #ef4444; opacity: .6; }
    .reg-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
    .reg-name { font-size: 16px; font-weight: 700; }
    .reg-status { font-size: 11px; padding: 3px 10px; border-radius: 20px; font-weight: 700; }
    .status-pending { background: #fef3c7; color: #92400e; }
    .status-paid { background: #dcfce7; color: #166534; }
    .status-cancel { background: #fee2e2; color: #991b1b; }
    .reg-info { font-size: 12px; color: #555; line-height: 2; }
    .reg-info b { color: #1a1a1a; }
    .reg-slots { font-size: 11px; color: #666; background: #f8fafc; border-radius: 8px; padding: 8px 10px; margin: 8px 0; line-height: 1.9; border: 1px solid #e2e8f0; }
    .status-refund { background: #fce7f3; color: #9d174d; }
    .student-search { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1.5px solid #e2e8f0; font-size: 13px; margin-bottom: 12px; box-sizing: border-box; }
    .student-card { background: #fff; border-radius: 12px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.05); overflow: hidden; }
    .student-head { padding: 12px 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 10px; user-select: none; }
    .student-name { font-size: 15px; font-weight: 700; color: #1a1a1a; }
    .student-sub { font-size: 11px; color: #888; margin-top: 2px; }
    .student-chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .student-chip { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px; white-space: nowrap; }
    .chip-classes { background: #eff6ff; color: #1d4ed8; }
    .chip-paid { background: #dcfce7; color: #166534; }
    .chip-pending { background: #fef3c7; color: #92400e; }
    .chip-cancel { background: #fee2e2; color: #991b1b; }
    .chip-refund { background: #fce7f3; color: #9d174d; }
    .student-body { display: none; border-top: 1px solid #f1f5f9; padding: 12px 16px 14px; background: #f8fafc; }
    .student-order-row { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; font-size: 12px; color: #555; line-height: 1.8; }
    .student-order-row b { color: #1a1a1a; }
    .student-order-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .reg-actions { display: flex; gap: 8px; margin-top: 10px; }
    .btn-confirm { flex: 1; padding: 9px; background: #16a34a; color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; }
    .btn-confirm:hover { background: #15803d; }
    .btn-cancel { flex: 1; padding: 9px; background: #fff; color: #dc2626; border: 1.5px solid #dc2626; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; }
    .btn-cancel:hover { background: #fee2e2; }

    .empty { text-align: center; padding: 3rem; color: #888; font-size: 14px; }
    .refresh-btn { padding: 7px 16px; background: #1d4ed8; color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .loading { text-align: center; padding: 2rem; color: #888; }

    /* 繳費單按鈕 */
    .btn-invoice { flex: 1; padding: 9px; background: #fff; color: #7c3aed; border: 1.5px solid #7c3aed; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; }
    .btn-invoice:hover { background: #f5f3ff; }

    /* Modal */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 999; align-items: center; justify-content: center; padding: 1rem; }
    .modal-overlay.open { display: flex; }
    .modal-box { background: #fff; border-radius: 16px; width: 100%; max-width: 440px; max-height: 92vh; overflow-y: auto; box-shadow: 0 24px 64px rgba(0,0,0,.25); }
    .modal-hd { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid #f1f5f9; position: sticky; top: 0; background: #fff; z-index: 1; border-radius: 16px 16px 0 0; }
    .modal-hd-title { font-size: 14px; font-weight: 700; }
    .modal-close { background: none; border: none; font-size: 22px; line-height: 1; cursor: pointer; color: #aaa; }
    .modal-close:hover { color: #555; }
    .inv { padding: 18px; }
    .inv-hero { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
    .inv-icon { width: 44px; height: 44px; background: linear-gradient(135deg,#4f46e5,#7c3aed); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
    .inv-title { font-size: 16px; font-weight: 800; color: #111; }
    .inv-subtitle { font-size: 11px; color: #888; margin-top: 2px; }
    .inv-block { background: #f8fafc; border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
    .inv-block-title { font-size: 10px; font-weight: 700; color: #6b7280; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 9px; }
    .inv-row { display: flex; justify-content: space-between; align-items: baseline; font-size: 12.5px; margin-bottom: 6px; }
    .inv-row:last-child { margin-bottom: 0; }
    .inv-label { color: #6b7280; flex-shrink: 0; margin-right: 8px; }
    .inv-val { font-weight: 600; color: #111; text-align: right; }
    .inv-val.accent { color: #7c3aed; }
    .inv-total { background: linear-gradient(135deg,#4f46e5,#7c3aed); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .inv-total-label { font-size: 13px; color: rgba(255,255,255,.85); font-weight: 600; }
    .inv-total-amount { font-size: 24px; font-weight: 800; color: #fff; }
    .inv-bank { background: #eff6ff; border: 1.5px solid #bfdbfe; border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
    .inv-bank-title { font-size: 10px; font-weight: 700; color: #1d4ed8; letter-spacing: .08em; margin-bottom: 9px; }
    .inv-bank-row { display: flex; justify-content: space-between; font-size: 12.5px; margin-bottom: 6px; }
    .inv-bank-row:last-child { margin-bottom: 0; }
    .inv-bank-label { color: #3b82f6; }
    .inv-bank-val { font-weight: 700; color: #1e3a8a; font-family: 'Courier New', monospace; letter-spacing: .04em; }
    .inv-note { background: #fef9c3; border-radius: 8px; padding: 10px 13px; font-size: 12px; color: #78350f; line-height: 1.7; }

    /* 金流總覽 */
    .cash-toolbar { display:flex; gap:8px; align-items:center; margin-bottom:1rem; flex-wrap:wrap; }
    .cash-toolbar select { padding:8px 10px; border-radius:8px; border:1.5px solid #e2e8f0; font-size:14px; background:#fff; }
    .cash-stats { display:grid; grid-template-columns: repeat(3,1fr); gap:10px; margin-bottom:1.25rem; }
    .cash-stat { background:#fff; border-radius:12px; padding:14px; text-align:center; box-shadow:0 1px 4px rgba(0,0,0,.05); }
    .cash-stat-n { font-size:20px; font-weight:700; }
    .cash-stat-n.income { color:#16a34a; }
    .cash-stat-n.refund { color:#db2777; }
    .cash-stat-n.net { color:#1d4ed8; }
    .cash-stat-l { font-size:11px; color:#888; margin-top:2px; }
    .cash-row { display:flex; justify-content:space-between; align-items:center; background:#fff; border-radius:10px; padding:10px 14px; margin-bottom:8px; box-shadow:0 1px 4px rgba(0,0,0,.05); border-left:3px solid #e2e8f0; font-size:13px; }
    .cash-row.income { border-left-color:#22c55e; }
    .cash-row.refund { border-left-color:#db2777; }
    .cash-row-name { font-weight:700; }
    .cash-row-meta { font-size:11px; color:#888; margin-top:2px; }
    .cash-row-amt { font-weight:700; font-size:14px; }
    .cash-row-amt.income { color:#16a34a; }
    .cash-row-amt.refund { color:#db2777; }
    .modal-ft { display: flex; gap: 8px; padding: 12px 18px; border-top: 1px solid #f1f5f9; position: sticky; bottom: 0; background: #fff; border-radius: 0 0 16px 16px; }
    .modal-ft button { flex: 1; padding: 10px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; border: none; }
    .btn-copy-inv { background: #f1f5f9; color: #374151; }
    .btn-copy-inv:hover { background: #e2e8f0; }
    .btn-print-inv { background: linear-gradient(135deg,#4f46e5,#7c3aed); color: #fff; }
    @media print {
      body > *:not(#invoice-modal) { display: none !important; }
      #invoice-modal { display: block !important; position: static !important; background: none !important; padding: 0 !important; }
      .modal-box { box-shadow: none !important; max-height: none !important; }
      .modal-hd, .modal-ft { display: none !important; }
    }
    .admin-tabs { display:flex; gap:8px; margin-bottom:1.25rem; }
    .atab { flex:1; padding:11px; border-radius:10px; border:1.5px solid #e2e8f0; background:#fff; color:#666; font-size:14px; font-weight:700; cursor:pointer; }
    .atab.active { background:#1d4ed8; color:#fff; border-color:#1d4ed8; }
    .remind-toolbar { display:flex; gap:8px; align-items:center; margin-bottom:1rem; flex-wrap:wrap; }
    .rq-btn { padding:7px 16px; border-radius:20px; border:1.5px solid #e2e8f0; background:#fff; color:#666; font-size:13px; font-weight:600; cursor:pointer; }
    .rq-btn.active { background:#1d4ed8; color:#fff; border-color:#1d4ed8; }
    .remind-toolbar select { flex:1; min-width:150px; padding:8px 10px; border-radius:8px; border:1.5px solid #e2e8f0; font-size:14px; background:#fff; }
    .remind-summary { font-size:13px; color:#334155; margin-bottom:14px; padding:9px 12px; background:#eff6ff; border:1px solid #bfdbfe; border-radius:8px; }
    .cls-card { background:#fff; border-radius:12px; box-shadow:0 1px 4px rgba(0,0,0,.05); margin-bottom:14px; overflow:hidden; }
    .cls-head { padding:12px 14px; background:#dbeafe; }
    .cls-time { font-size:15px; font-weight:700; color:#1e3a8a; }
    .cls-meta { font-size:12px; color:#3b5b80; margin-top:3px; }
    .cls-body { padding:12px 14px; }
    .stu-row { display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid #f1f5f9; font-size:13px; }
    .stu-row:last-child { border-bottom:none; }
    .stu-name { font-weight:700; min-width:60px; flex-shrink:0; }
    .stu-contact { flex:1; color:#666; font-size:12px; word-break:break-all; }
    .mini-btn { padding:4px 9px; font-size:11px; border-radius:6px; border:1px solid #cbd5e1; background:#fff; color:#475569; cursor:pointer; font-weight:600; flex-shrink:0; }
    .cls-empty { font-size:13px; color:#999; padding:6px 0; }
    .pend-note { font-size:12px; color:#b45309; margin-top:10px; padding-top:8px; border-top:1px dashed #fde68a; }
    .msg-box { margin-top:14px; }
    .msg-box textarea { width:100%; box-sizing:border-box; border:1.5px solid #e2e8f0; border-radius:8px; padding:10px; font-size:13px; line-height:1.7; color:#333; resize:vertical; min-height:150px; font-family:inherit; background:#fafafa; }
    .copy-msg-btn { margin-top:8px; width:100%; padding:10px; border-radius:8px; border:none; background:#16a34a; color:#fff; font-size:14px; font-weight:700; cursor:pointer; }
    .copy-msg-btn:active { transform:scale(.99); }
  </style>
</head>
<body>

<!-- 繳費單 Modal -->
<div class="modal-overlay" id="invoice-modal" onclick="if(event.target===this)closeInvoice()">
  <div class="modal-box">
    <div class="modal-hd">
      <div class="modal-hd-title">📋 繳費單</div>
      <button class="modal-close" onclick="closeInvoice()">×</button>
    </div>
    <div id="invoice-content"></div>
    <div class="modal-ft">
      <button class="btn-copy-inv" onclick="copyInvoiceText()">📋 複製文字</button>
      <button class="btn-print-inv" onclick="saveInvoiceImage()">📸 儲存圖片</button>
    </div>
  </div>
</div>
<div class="container">

  <!-- 登入 -->
  <div id="login-box" class="login-box">
    <div style="font-size:36px;margin-bottom:10px;">🎾</div>
    <div class="login-title">教練後台</div>
    <div class="login-sub">請輸入管理密碼</div>
    <input id="pass-input" class="login-input" type="password" placeholder="密碼" onkeydown="if(event.key==='Enter')login()">
    <button class="login-btn" onclick="login()">登入</button>
    <div class="login-err" id="login-err"></div>
  </div>

  <!-- 後台主體 -->
  <div id="admin-body" style="display:none;">
    <div class="header">
      <div class="header-title">🎾 報名管理</div>
      <div style="display:flex;gap:8px;align-items:center;">
        <button class="refresh-btn" onclick="loadData()">🔄 重新整理</button>
        <button class="logout-btn" onclick="logout()">登出</button>
      </div>
    </div>

    <div class="admin-tabs">
      <button class="atab active" id="atab-reg" onclick="switchTab('reg')">📋 報名管理</button>
      <button class="atab" id="atab-remind" onclick="switchTab('remind')">🔔 上課提醒</button>
      <button class="atab" id="atab-coach" onclick="switchTab('coach')">⚙️ 課程設定</button>
      <button class="atab" id="atab-cash" onclick="switchTab('cash')">💰 金流總覽</button>
      <button class="atab" id="atab-students" onclick="switchTab('students')">👥 學生總覽</button>
    </div>

    <div id="tab-reg">
    <div class="stats">
      <div class="stat"><div class="stat-n pending" id="cnt-pending">-</div><div class="stat-l">⏳ 待確認</div></div>
      <div class="stat"><div class="stat-n paid"    id="cnt-paid">-</div><div class="stat-l">✅ 已繳費</div></div>
      <div class="stat"><div class="stat-n cancel"  id="cnt-cancel">-</div><div class="stat-l">❌ 已取消</div></div>
    </div>

    <div class="filter-bar">
      <button class="filter-btn active" onclick="setFilter('all',this)">全部</button>
      <button class="filter-btn" onclick="setFilter('pending',this)">⏳ 待確認</button>
      <button class="filter-btn" onclick="setFilter('paid',this)">✅ 已繳費</button>
      <button class="filter-btn" onclick="setFilter('cancel',this)">❌ 已取消</button>
    </div>

    <div id="reg-list"><div class="loading">載入中...</div></div>
    </div><!-- /tab-reg -->

    <div id="tab-remind" style="display:none;">
      <div class="remind-toolbar">
        <button class="rq-btn" id="rq-today" onclick="remindQuick('today')">今天</button>
        <button class="rq-btn active" id="rq-tomorrow" onclick="remindQuick('tomorrow')">明天</button>
        <select id="remind-date" onchange="remindDateChanged()"></select>
      </div>
      <div id="remind-content"><div class="loading">請選擇日期</div></div>
    </div>

    <div id="tab-coach" style="display:none;">
      <div class="remind-summary">在這裡指定每堂課的教練、或標記某堂已被學生私下預訂（會限制名額並顯示標籤），儲存後會直接反映在報名頁面（index）給學生看。留空則維持預設。</div>
      <div id="coach-content"><div class="loading">載入中...</div></div>
    </div>

    <div id="tab-cash" style="display:none;">
      <div class="cash-toolbar">
        <select id="cash-month" onchange="loadAccounting()">
          <option value="all">全部月份</option>
          <option value="07">7月</option>
          <option value="08">8月</option>
          <option value="09">9月</option>
          <option value="10">10月</option>
          <option value="11">11月</option>
          <option value="12">12月</option>
        </select>
        <button class="refresh-btn" onclick="loadAccounting()">🔄 重新整理</button>
      </div>
      <div id="cash-content"><div class="loading">載入中...</div></div>
    </div>

    <div id="tab-students" style="display:none;">
      <input type="text" class="student-search" id="student-search" placeholder="搜尋學生姓名、LINE ID 或電話..." oninput="renderStudentsTab()">
      <div id="students-content"><div class="loading">載入中...</div></div>
    </div>

  </div>

</div>

const SLOT_LABELS = Object.fromEntries(Object.entries(SLOT_INFO).map(([k,v])=>[k,v.label]));

// 雙教練課：第二個 court 的 key alias 到第一個 court（顯示時合併為同一堂）
const SLOT_ALIAS = {
  's-9-1': 's-9-0',  // 09/01(二) 19:00-20:00 court5 → 同堂為 court6
};

// Sheet 裡的 slots 欄位存的其實是「顯示標籤」（如 07/02(四) 19:00-20:00），不是 key。
// 這裡建立 label → key 的反查表，讓需要比對 key 的地方（例如上課提醒）能正確解析。
// 12月幾組比賽時段標籤重複（12/23、12/24），比賽不開放選課，不影響此反查表用途。
const SLOT_KEY_BY_LABEL = {};
Object.entries(SLOT_INFO).forEach(([k, v]) => {
  if (!SLOT_KEY_BY_LABEL[v.label]) SLOT_KEY_BY_LABEL[v.label] = k;
});

// 將原始字串（可能是 key，也可能是 label）解析為正確的 slot key
function resolveSlotKey(raw) {
  const clean = String(raw || '').trim();
  if (!clean) return '';
  if (SLOT_INFO[clean]) return canonKey(clean);            // 本身就是合法 key
  if (SLOT_KEY_BY_LABEL[clean]) return canonKey(SLOT_KEY_BY_LABEL[clean]); // 是 label，反查成 key
  return canonKey(clean);                                    // 都找不到，原樣返回
}

// 將時段字串中的 key 解碼為可讀標籤，雙教練重複時段自動去重
function decodeSlotStr(str) {
  if (!str || str === '—') return str;
  const seen = new Set();
  return str.split(/\n|,/).map(s => {
    const raw = s.trim();
    const k = SLOT_ALIAS[raw] || raw;   // alias 替換
    const label = SLOT_LABELS[k] || k;
    if (seen.has(label)) return null;   // 去重：同標籤只顯示一次
    seen.add(label);
    return label;
  }).filter(Boolean).join('\n');
}

  document.getElementById('reg-list').innerHTML = filtered.map(r => {

    return `<div class="reg-card ${sc}">
      <div class="reg-top">
        <div>
          <div class="reg-name">${r.name}</div>
          ${r.orderId ? `<div style="font-size:11px;color:#888;margin-top:2px;">${r.orderId}</div>` : ''}
        </div>

        <b>程度：</b>${r.level} ｜ <b>課程費：</b>${r.fee}${r.discount !== '—' ? '（折扣 '+r.discount+'）' : ''}<br>
        <b>堂數：</b>小班 ${r.small} 堂・大班 ${r.big} 堂・對打 ${r.rally} 堂<br>
        <b>團體賽：</b>${r.tournament || '—'} ｜ <b>報名時間：</b>${r.time}
      </div>
      ${slotsDisplay ? `<div class="reg-slots"><b>正選時段：</b><br>${slotsDisplay.replace(/\n/g,'<br>')}</div>` : ''}
      ${waitlistDisplay ? `<div class="reg-slots" style="background:#faf5ff;border-color:#e9d5ff;"><b>候補時段：</b><br>${waitlistDisplay.replace(/\n/g,'<br>')}</div>` : ''}
      ${!isCancelled ? `<div class="reg-actions">
        ${isPending ? `<button class="btn-confirm" onclick="confirmPayment(${r.rowIndex})">✅ 確認已繳費</button>` : '<div style="flex:1;"></div>'}
        <button class="btn-invoice" onclick='showInvoice(${JSON.stringify(r).replace(/'/g,"&#39;")})'>📋 繳費單</button>
        <button class="btn-cancel" onclick="cancelReg(${r.rowIndex})">${isPending ? '❌ 取消報名' : '🔄 標記取消'}</button>
      </div>` : ''}
    </div>`;
  }).join('');
}

// ========================================================
//  👥 學生總覽（依 LINE ID / 電話彙整每位學生的所有訂單）
// ========================================================
function feeToNum(str){ return parseInt((str||'0').toString().replace(/[^\d-]/g,'')) || 0; }

// 分組邏輯：姓名 + 聯絡方式（電話優先，其次 LINE ID）
// 這是根據實際資料調整過的判斷方式，因為單純用 LINE ID 或電話分組會有兩種已知問題：
// 1) 同一位學生的 LINE ID 欄位歷史上曾填入不一致的內容（如暱稱、備註文字），但姓名、電話較穩定
// 2) 有些學生（如家人）共用同一組電話/LINE，但其實是不同人、應該分開列出
// 姓名+聯絡方式的組合沒辦法 100% 解決，但比單一欄位更準確；若姓名或聯絡方式其中一項對不上，
// 同一人仍可能被拆成兩張卡片——教練可透過卡片上顯示的電話/LINE 自行比對是否為同一人。
function studentKeyOf(r){
  const name  = (r.name  || '').toString().trim().toLowerCase();
  const line  = (r.line  || '').toString().trim();
  const phone = (r.phone || '').toString().trim();
  const contact = phone || line || '';
  if (name && contact) return name + '||' + contact;
  return contact || ('name:' + name) || 'unknown';
}

function buildStudentGroups(){
  const groups = {};
  allRows.forEach(r => {
    const key = studentKeyOf(r);
    if (!groups[key]) {
      groups[key] = { key, name: r.name, line: r.line, phone: r.phone, orders: [] };
    }
    groups[key].orders.push(r);
    // 名稱/聯絡方式以最新一筆（時間最晚）為主，補齊缺漏欄位
    groups[key].name  = groups[key].name  || r.name;
    groups[key].line  = groups[key].line  || r.line;
    groups[key].phone = groups[key].phone || r.phone;
  });
  return Object.values(groups);
}

// 課程費欄位在 Google Sheets 中常會被自動轉成純數字（貨幣格式），而非帶 "$" 的文字，
// 這裡統一用數字重新格式化顯示，避免畫面忽有 $ 忽無
function formatFeeDisplay(feeRaw){
  return '$' + feeToNum(feeRaw).toLocaleString();
}
function formatDiscountDisplay(discRaw){
  if (discRaw === undefined || discRaw === null || discRaw === '' || discRaw === '—') return '—';
  const n = feeToNum(discRaw);
  if (n === 0) return '—';
  return (n < 0 ? '-$' : '-$') + Math.abs(n).toLocaleString();
}

  if (!allRows || allRows.length === 0) {

    return;
  }

  const kw = (document.getElementById('student-search').value || '').trim().toLowerCase();
  let groups = buildStudentGroups();

  if (kw) {
    groups = groups.filter(g =>
      (g.name || '').toLowerCase().includes(kw) ||
      (g.line || '').toString().toLowerCase().includes(kw) ||
      (g.phone || '').toString().toLowerCase().includes(kw)
    );
  }

  // 依「最近一次報名時間」排序，最新學生在最上面
  groups.sort((a,b) => {
    const ta = a.orders.map(o=>o.time||'').sort().pop() || '';
    const tb = b.orders.map(o=>o.time||'').sort().pop() || '';
    return tb.localeCompare(ta);
  });

  if (groups.length === 0) {
    container.innerHTML = '<div class="empty">找不到符合的學生</div>';
    return;
  }

  const statusBadge = { '待確認':'status-pending', '已繳費✅':'status-paid', '已取消❌':'status-cancel', '已退費':'status-refund' };

  container.innerHTML = groups.map((g, idx) => {
    const paidOrders    = g.orders.filter(o => o.status === '已繳費✅');
    const pendingOrders = g.orders.filter(o => o.status === '待確認');
    const cancelOrders  = g.orders.filter(o => o.status === '已取消❌');
    const refundOrders  = g.orders.filter(o => o.status === '已退費');

    const totalPaid    = paidOrders.reduce((s,o)=>s+feeToNum(o.fee), 0);
    const totalPending = pendingOrders.reduce((s,o)=>s+feeToNum(o.fee), 0);
    const totalRefund  = refundOrders.reduce((s,o)=>s+feeToNum(o.refundAmount), 0);
    const activeClasses = [...paidOrders, ...pendingOrders]
      .reduce((s,o)=> s + (parseInt(o.small)||0) + (parseInt(o.big)||0) + (parseInt(o.rally)||0), 0);

    const bodyId = `student-body-${idx}`, iconId = `student-icon-${idx}`;

    const orderRows = g.orders
      .slice()
      .sort((a,b) => (b.time||'').localeCompare(a.time||''))
      .map(o => {
        const sb = statusBadge[o.status] || 'status-pending';
        const slotsDisplay = decodeSlotStr(o.slots || '');
        const refundLine = o.status === '已退費'
          ? `<br><b>退費金額：</b>$${feeToNum(o.refundAmount).toLocaleString()}｜<b>原因：</b>${o.refundReason||'—'}｜<b>經手人：</b>${o.refundHandler||'—'}`
          : '';
        return `<div class="student-order-row">
          <div class="student-order-top">
            <span>${o.orderId||'—'}</span>
            <span class="reg-status ${sb}">${o.status}</span>
          </div>
          <b>報名時間：</b>${o.time||'—'}｜<b>程度：</b>${o.level||'—'}<br>
          <b>課程費：</b>${formatFeeDisplay(o.fee)}${formatDiscountDisplay(o.discount)!=='—' ? '（折扣 '+formatDiscountDisplay(o.discount)+'）' : ''}｜
          <b>堂數：</b>小班${o.small||0}・大班${o.big||0}・對打${o.rally||0}${refundLine}
          ${slotsDisplay ? `<div class="reg-slots" style="margin-top:6px;">${slotsDisplay.replace(/\n/g,'<br>')}</div>` : ''}
        </div>`;
      }).join('');

    return `<div class="student-card">
      <div class="student-head" onclick="toggleStudentBody('${bodyId}','${iconId}')">
        <div>
          <div class="student-name">${g.name || '（未填姓名）'}</div>
          <div class="student-sub">LINE：${g.line || '—'} ｜ 電話：${g.phone || '—'} <span id="${iconId}">▼ 點擊展開所有訂單</span></div>
        </div>
        <div class="student-chips">
          <span class="student-chip chip-classes">共 ${activeClasses} 堂</span>
          <span class="student-chip chip-paid">已收 $${totalPaid.toLocaleString()}</span>
          ${totalPending>0 ? `<span class="student-chip chip-pending">待收 $${totalPending.toLocaleString()}</span>` : ''}
          ${cancelOrders.length>0 ? `<span class="student-chip chip-cancel">取消 ${cancelOrders.length}</span>` : ''}
          ${refundOrders.length>0 ? `<span class="student-chip chip-refund">退費 $${totalRefund.toLocaleString()}</span>` : ''}
        </div>
      </div>
      <div class="student-body" id="${bodyId}">${orderRows}</div>
    </div>`;
  }).join('');
}

function toggleStudentBody(bodyId, iconId){
  const body = document.getElementById(bodyId), icon = document.getElementById(iconId);
  if (!body) return;
  const isOpen = body.style.display === 'block';
  body.style.display = isOpen ? 'none' : 'block';
  if (icon) icon.textContent = isOpen ? '▼ 點擊展開所有訂單' : '▲ 點擊收合';
}

function renderAccounting(data) {
  const box = document.getElementById('cash-content');
  const records = (data.records || []).slice().sort((a,b) => String(b.date).localeCompare(String(a.date)));

  const statsHtml = `<div class="cash-stats">
    <div class="cash-stat"><div class="cash-stat-n income">NT$ ${(data.totalIncome||0).toLocaleString()}</div><div class="cash-stat-l">💰 總收入</div></div>
    <div class="cash-stat"><div class="cash-stat-n refund">NT$ ${(data.totalRefund||0).toLocaleString()}</div><div class="cash-stat-l">💸 總退費</div></div>
    <div class="cash-stat"><div class="cash-stat-n net">NT$ ${(data.netIncome||0).toLocaleString()}</div><div class="cash-stat-l">📊 淨收入</div></div>
  </div>`;

  if (!records.length) {
    box.innerHTML = statsHtml + '<div class="empty">此區間沒有交易紀錄</div>';
    return;
  }

  const rowsHtml = records.map(r => {
    const isIncome = r.type === '收款';
    const cls = isIncome ? 'income' : 'refund';
    const amtDisplay = (isIncome ? '+' : '') + 'NT$ ' + Math.abs(r.amount).toLocaleString();
    return `<div class="cash-row ${cls}">
      <div>
        <div class="cash-row-name">${escHtml(r.name)}</div>
        <div class="cash-row-meta">${escHtml(r.date || '')} ｜ ${r.type}${r.reason ? '（'+escHtml(r.reason)+'）' : ''}</div>
      </div>
      <div class="cash-row-amt ${cls}">${amtDisplay}</div>
    </div>`;
  }).join('');

  box.innerHTML = statsHtml + rowsHtml;
}

  const parts = [];
  if (small > 0) parts.push(`小班 ${small} 堂`);
  if (big   > 0) parts.push(`大班 ${big} 堂`);
  if (rally > 0) parts.push(`對打 ${rally} 堂`);
  const classCount = parts.join('・') || '—';

  // 費用與折扣計算

  // 這裡不能再打一次95折，否則會變成折扣兩次。改用當時實際記錄的 r.discount 回推原價。
  const finalFee    = parseFloat(String(r.fee).replace(/[^0-9.]/g, '')) || 0;
  const discountAmt = (r.discount && String(r.discount).trim() !== '—')
    ? parseFloat(String(r.discount).replace(/[^0-9.]/g, '')) || 0

  const hasDiscount = discountAmt > 0;
  const feeRaw      = finalFee + discountAmt; // 回推的原價（僅顯示用）

  function decodeToItems(str) {
    if (!str || str === '—') return [];
    const seen = new Set();
    return str.split(/\n|,/).map(s => {

      const info = SLOT_INFO[k] || SLOT_BY_LABEL[raw];
      if (!info) return { label: raw, date: raw, time: '', cls: '', coach: '' };

      seen.add(info.label);

    ? '\n（已達6堂，可免費參加 12/23-24 團體賽，如有意願請告知教練）'

 invoiceTextCache =

          <input type="number" id="cap-input-${k}" value="${curCap}" placeholder="預設名額" min="1" style="width:90px;padding:8px 10px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:13px;">
          <input type="text" id="tag-input-${k}" value="${escHtml(curTag)}" placeholder="標籤（如：已預訂）" style="flex:1;min-width:100px;padding:8px 10px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:13px;">
          <button class="mini-btn" onclick="document.getElementById('cap-input-${k}').value='1';document.getElementById('tag-input-${k}').value='已預訂';">📌 標記已預訂（限1位）</button>
          <button class="mini-btn" onclick="document.getElementById('cap-input-${k}').value='';document.getElementById('tag-input-${k}').value='';">清除限定</button>
          <button class="copy-msg-btn" style="width:auto;padding:8px 16px;margin-top:0;background:linear-gradient(135deg,#d97706,#b45309);" onclick="saveSlotOverride('${k}',this)">💾 儲存名額標記</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

async function saveCoach(key, btn){
  const input = document.getElementById(`coach-input-${key}`);
  const val = input.value.trim();
  const orig = btn.textContent;
  btn.disabled = true; btn.textContent = '儲存中...';
  try{
    const res = await fetch(`${GAS_URL}?action=setCoach&pass=${encodeURIComponent(adminPass)}&slotKey=${encodeURIComponent(key)}&coach=${encodeURIComponent(val)}`);
    const data = await res.json();
    if(data.status === 'ok'){
      coachAssignments[key] = val;
      btn.textContent = '✅ 已儲存';
    } else {
      btn.textContent = '❌ ' + (data.message || '失敗');
    }
  }catch(e){
    btn.textContent = '❌ 連線失敗';
  }
  setTimeout(()=>{ btn.textContent = orig; btn.disabled = false; }, 1500);
}

async function saveSlotOverride(key, btn){
  const cap = document.getElementById(`cap-input-${key}`).value.trim();
  const tag = document.getElementById(`tag-input-${key}`).value.trim();
  const orig = btn.textContent;
  btn.disabled = true; btn.textContent = '儲存中...';
  try{
    const res = await fetch(`${GAS_URL}?action=setSlotOverride&pass=${encodeURIComponent(adminPass)}&slotKey=${encodeURIComponent(key)}&capacity=${encodeURIComponent(cap)}&tag=${encodeURIComponent(tag)}`);
    const data = await res.json();
    if(data.status === 'ok'){
      slotOverrides[key] = { capacity: cap ? parseInt(cap) : null, tag };
      btn.textContent = '✅ 已儲存';
    } else {
      btn.textContent = '❌ ' + (data.message || '失敗');
    }
  }catch(e){
    btn.textContent = '❌ 連線失敗';
  }
  setTimeout(()=>{ btn.textContent = orig; btn.disabled = false; }, 1500);
}
function courtLabel(c){
  const aliasSrc = Object.keys(SLOT_ALIAS).find(k => SLOT_ALIAS[k] === c.key);
  if(aliasSrc && SLOT_INFO[aliasSrc] && SLOT_INFO[aliasSrc].court){
    const courts = [c.court, SLOT_INFO[aliasSrc].court].filter(Boolean).sort((a,b)=>a-b);
    return courts.join('+') + '面';
  }
  return c.court ? `第${c.court}面` : '';
}
function mmddNum(d){ const m=String(d).match(/(\d{2})\/(\d{2})/); return m ? parseInt(m[1])*100+parseInt(m[2]) : 0; }

function todayMMDD(offset){
  const t = new Date(); t.setDate(t.getDate() + (offset||0));
  return String(t.getMonth()+1).padStart(2,'0') + '/' + String(t.getDate()).padStart(2,'0');
}

function allClassDates(){
  const seen = new Set(), list = [];
  for(const [k,v] of Object.entries(SLOT_INFO)){
    if(SLOT_ALIAS[k]) continue;
    if(seen.has(v.date)) continue;
    seen.add(v.date); list.push(v.date);
  }
  list.sort((a,b)=> mmddNum(a) - mmddNum(b));
  return list;
}

function buildRemindDates(){
  const sel = document.getElementById('remind-date');
  sel.innerHTML = allClassDates().map(d=>`<option value="${d}">${d}</option>`).join('');
}

function defaultRemindDate(){
  const dates = allClassDates();
  const tm = todayMMDD(1), td = todayMMDD(0);
  const todayN = mmddNum(td);
  return dates.find(x=>x.startsWith(tm))
      || dates.find(x=>x.startsWith(td))
      || dates.find(x=>mmddNum(x) >= todayN)
      || dates[0] || '';
}

function syncQuickActive(){
  const v = document.getElementById('remind-date').value || '';
  document.getElementById('rq-today').classList.toggle('active', v.startsWith(todayMMDD(0)));
  document.getElementById('rq-tomorrow').classList.toggle('active', v.startsWith(todayMMDD(1)));
}

function remindQuick(which){
  const target = which==='today' ? todayMMDD(0) : todayMMDD(1);
  const sel = document.getElementById('remind-date');
  if(!sel.options.length) buildRemindDates();
  let found = null;
  for(const o of sel.options){ if(o.value.startsWith(target)){ found = o.value; break; } }
  if(found){ sel.value = found; syncQuickActive(); renderRemind(); }
  else {
    syncQuickActive();
    document.getElementById('remind-content').innerHTML =
      `<div class="empty">${which==='today'?'今天':'明天'}（${target}）沒有課</div>`;
  }
}

function remindDateChanged(){ syncQuickActive(); renderRemind(); }

function relWord(dateStr){
  if(dateStr.startsWith(todayMMDD(0))) return '今天';
  if(dateStr.startsWith(todayMMDD(1))) return '明天';
  return dateStr.slice(0,5);
}

function escHtml(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/"/g,'&quot;')
    .replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderRemind(){
  const date = document.getElementById('remind-date').value;
  const box  = document.getElementById('remind-content');
  if(!date){ box.innerHTML = '<div class="empty">請選擇日期</div>'; return; }

  const classes = Object.entries(SLOT_INFO)
    .filter(([k,v]) => v.date===date && !SLOT_ALIAS[k])
    .map(([k,v]) => ({key:k, ...v}))
    .sort((a,b)=> a.time.localeCompare(b.time));

  if(!classes.length){ box.innerHTML = `<div class="empty">${date} 沒有課</div>`; return; }

  const rows = allRows || [];
  const inClass = (r,key) => (r.slots||'').split(/[,\n]/).map(x=>resolveSlotKey(x)).includes(key);
  const word = relWord(date);

  let totalPaid = 0;
  const cardsHtml = classes.map(c => {
    const paid = rows.filter(r => r.status==='已繳費✅' && inClass(r,c.key));
    const pend = rows.filter(r => r.status==='待確認'   && inClass(r,c.key));
    totalPaid += paid.length;

    const stuRows = paid.length ? paid.map(r=>{
      const line  = String(r.line ||'').replace(/^'/,'');
      const phone = String(r.phone||'').replace(/^'/,'');
      const contact = [line?('LINE: '+line):'', phone?('☎ '+phone):''].filter(Boolean).join('　');
      return `<div class="stu-row">
        <span class="stu-name">${escHtml(r.name)}</span>
        <span class="stu-contact">${escHtml(contact)||'—'}</span>
        ${line?`<button class="mini-btn" data-copy="${escHtml(line)}" onclick="copyToClipboard(this.dataset.copy,this)">複製LINE</button>`:''}
      </div>`;
    }).join('') : `<div class="cls-empty">尚無已繳費學生</div>`;

    const pendNote = pend.length
      ? `<div class="pend-note">⏳ 待確認 ${pend.length} 位：${pend.map(r=>escHtml(r.name)).join('、')}</div>`
      : '';

    const court = courtLabel(c);
    const msg = [
  '🎾 網球課提醒',
  '',
  `Hi 👋 提醒您 ${word} 有課：`,
  `📅 ${date}`,
  `⏰ ${c.time}（${c.cls}）`,
  `📍 中正河濱網球場${court ? '　'+court : ''}`,
  'https://maps.app.goo.gl/ZYJNHE8QJwikpnTs8',
  '🚗 **搭 Uber 的同學**建議導航到：',
  '「100 台北市中正區螢雪里詔安街38巷2弄1號」',
  'https://maps.app.goo.gl/FoguUjhCvp3M26Xs5',
  '走過天橋就是球場囉！',
  '',
  '☀️ **記得準備：**',
  '💧 水',
  '🍌 上課前先吃點東西',
  '👕 運動服',
  '👟 運動鞋（有網球鞋更好',
  '🎾 球拍教練都會準備，不用另外攜帶～',
  '下雨停課會提前1小時另公布 🙏'
].join('\n');
      
    const msgBox = paid.length ? `<div class="msg-box">
        <textarea id="msg-${c.key}" readonly>${escHtml(msg)}</textarea>
        <button class="copy-msg-btn" onclick="copyElText('msg-${c.key}',this)">📋 複製提醒訊息</button>
      </div>` : '';

    return `<div class="cls-card">
      <div class="cls-head">
        <div class="cls-time">⏰ ${c.time}</div>
        <div class="cls-meta">${c.cls} ｜ ${courtLabel(c)} ｜ 已繳費 ${paid.length} 位</div>
      </div>
      <div class="cls-body">
        ${stuRows}
        ${pendNote}
        ${msgBox}
      </div>
    </div>`;
  }).join('');

  box.innerHTML =
    `<div class="remind-summary">📅 ${date}｜共 ${classes.length} 堂課・已繳費學生合計 ${totalPaid} 位</div>`
    + cardsHtml;
}

function copyElText(id, btn){
  const el = document.getElementById(id);
  copyToClipboard(el ? (el.value!==undefined ? el.value : el.textContent) : '', btn);
}
function copyToClipboard(text, btn){
  const ok = ()=>{ if(btn){ if(!btn.dataset.o) btn.dataset.o=btn.textContent; btn.textContent='✅ 已複製'; setTimeout(()=>{ btn.textContent=btn.dataset.o; },1500);} };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(ok, ()=>fallbackCopy(text,ok));
  } else fallbackCopy(text, ok);
}
function fallbackCopy(text, ok){
  try{
    const ta=document.createElement('textarea');
    ta.value=text; ta.style.position='fixed'; ta.style.top='0'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta); ok&&ok();
  }catch(e){ alert('複製失敗，請手動選取文字複製'); }
}
</script>
